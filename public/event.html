<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Event — GatePass</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="/index.html" class="brand"><span class="stub"></span>GatePass</a>
    <form id="search-form" class="search-form">
      <input type="text" placeholder="Search teams, artists, venues...">
      <button type="submit">Search</button>
    </form>
    <div class="header-links">
      <a href="/cart.html" class="cart-link">Cart <span id="cart-count" class="cart-count" style="display:none">0</span></a>
    </div>
  </div>
</header>

<nav class="category-nav">
  <div class="wrap" id="category-nav"></div>
</nav>

<section class="event-detail-hero">
  <div class="wrap">
    <div class="breadcrumb"><a href="/index.html">All events</a> / <span id="crumb-category">Event</span></div>
    <h1 id="event-name">Loading…</h1>
    <div class="meta-row" id="event-meta"></div>
  </div>
</section>

<div class="wrap detail-body">
  <div>
    <p class="blurb" id="event-blurb"></p>
    <div class="section-title" style="margin-top:0;">
      <h2>Available tickets</h2>
    </div>
    <div id="listings"></div>
  </div>
  <aside class="sidebar-card">
    <h3>Buyer protection</h3>
    <p>All ticket sales are final. Payments are processed securely through PayPal.</p>
  </aside>
</div>

<footer class="site-footer">
  <div class="wrap">© 2026 GatePass. All rights reserved.</div>
</footer>

<script src="/js/shared.js"></script>
<script src="/js/event.js"></script>
</body>
</html>
